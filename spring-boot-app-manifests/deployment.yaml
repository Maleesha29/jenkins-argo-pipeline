apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-apps
  labels:
    app: spring-boot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
    spec:
      containers:
        - name: spring-boot-app
          image: maleesha1129/jenkins-argo-pipeline:21
          ports:
            - containerPort: 8080
